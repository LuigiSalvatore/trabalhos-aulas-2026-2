<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ESP32 - Monitoramento Ambiental</title>
    <link rel="stylesheet" type="text/css" href="novo_estilo.css">
    <!-- Sem JavaScript: a página inteira recarrega sozinha a cada 2s -->
    <meta http-equiv="refresh" content="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>Sistemas Embarcados - Monitoramento ESP32</h1>
    </header>

    <main>
        <div class="cards-container">

            <div class="card">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <rect x="28" y="8" width="8" height="32" rx="4" fill="#f44336"/>
                    <circle cx="32" cy="46" r="10" fill="#f44336"/>
                    <rect x="30" y="12" width="4" height="30" fill="#ffffff"/>
                    <circle cx="32" cy="46" r="5" fill="#ffffff"/>
                </svg>
                <p class="sensor-labels">Temperatura</p>
                <p class="sensor-value"><b>%TEMP%</b><sup class="units">&deg;C</sup></p>
            </div>

            <div class="card">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 6 C20 24 12 34 12 44 a20 20 0 0 0 40 0 C52 34 44 24 32 6 Z" fill="#008CBA"/>
                </svg>
                <p class="sensor-labels">Umidade</p>
                <p class="sensor-value"><b>%UMID%</b><sup class="units">%</sup></p>
            </div>

            <div class="card">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="24" fill="none" stroke="#555555" stroke-width="4"/>
                    <line x1="32" y1="32" x2="44" y2="20" stroke="#f44336" stroke-width="3"/>
                    <circle cx="32" cy="32" r="3" fill="#555555"/>
                </svg>
                <p class="sensor-labels">Pressao</p>
                <p class="sensor-value"><b>%PRESSAO%</b><sup class="units">hPa</sup></p>
            </div>

            <div class="card">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="8,52 26,20 36,36 44,24 56,52" fill="#795548"/>
                    <polygon points="26,20 32,30 20,30" fill="#ffffff"/>
                </svg>
                <p class="sensor-labels">Altitude</p>
                <p class="sensor-value"><b>%ALTITUDE%</b><sup class="units">m</sup></p>
            </div>

            <div class="card">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="32" cy="16" rx="8" ry="14" fill="#008CBA"/>
                    <ellipse cx="48" cy="40" rx="8" ry="14" fill="#008CBA" transform="rotate(120 32 32)"/>
                    <ellipse cx="16" cy="40" rx="8" ry="14" fill="#008CBA" transform="rotate(240 32 32)"/>
                    <circle cx="32" cy="32" r="4" fill="#555555"/>
                </svg>
                <p class="sensor-labels">Ventilador</p>
                <p class="sensor-value status-%VENT_CLASSE%"><b>%VENTILADOR%</b></p>
            </div>

            <div class="card">
                <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <rect x="14" y="20" width="36" height="24" rx="4" fill="#ffb300"/>
                    <circle cx="32" cy="32" r="6" fill="#ffffff"/>
                </svg>
                <p class="sensor-labels">Rele</p>
                <p class="sensor-value status-%RELE_CLASSE%"><b>%RELE%</b></p>
                <p>
                    <a href="/rele_on"><button class="button button1">Ligar</button></a>
                    <a href="/rele_off"><button class="button button2">Desligar</button></a>
                </p>
            </div>

        </div>
    </main>

    <footer>
        <p>Sistemas Embarcados - PUCRS - 2026/2</p>
    </footer>
</body>
</html>
